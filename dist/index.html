    <!-- Preconnect to third-party origins used after first paint -->
    <link rel="preconnect" href="https://identity.netlify.com" crossorigin />
    <link rel="dns-prefetch" href="https://identity.netlify.com" />

    <!-- Brand fonts: preload WOFF2 so first paint isn't blocked on font network -->
    <link rel="preload" href="/fonts/SWITCHCOMMERCEBOLD.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/SWITCHCOMMERCEREG.woff2" as="font" type="font/woff2" crossorigin />

    <title>Team Switch Commerce</title>

    <!-- Netlify Identity: defer so it doesn't block parsing or first paint -->
    <!-- Inside the iOS shell the origin is capacitor://localhost, so the
         identity widget decides it is on a local dev server and prompts for
         the site URL instead of signing anyone in. It reads that answer from
         localStorage when the script loads, which is before any React code
         runs — so it has to be seeded here, ahead of the widget itself. -->
    <script>
      if (window.location.protocol === "capacitor:") {
        try { window.localStorage.setItem("netlifySiteURL", "https://switchcommerce.team"); } catch (e) {}
      }
    </script>
    <script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script type="module" crossorigin src="/assets/main-8a6b873e.js"></script>
